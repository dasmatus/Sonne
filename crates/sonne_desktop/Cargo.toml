[package]
name = "sonne_desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/sonne_desktop.rs"
doctest = false

[[bin]]
name = "sonne"
path = "src/main.rs"

[features]
default = ["wasm"]
# Runs wasm32-wasip2 previews in-process; off, Sonne previews native programs only.
wasm = ["sonne_preview/wasm"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
log.workspace = true
mcsapi-components.workspace = true
mcsapi-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
sonne_preview = { workspace = true, features = ["host"] }
sonne_setup.workspace = true
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
